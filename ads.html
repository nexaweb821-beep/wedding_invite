body { margin: 0; background: #ece3d0; color: var(--ink); font-family: var(--sans); font-weight: 300; }

.slot { background: #fff9; border: 1px solid #b08a3e55; padding: 16px; display: grid; gap: 12px; align-content: start; }

.view .ad { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.slot textarea { width: 100%; min-height: 150px; font: 14px/1.5 var(--sans); padding: 10px; border: 1px solid #b08a3e66; background: #fff; color: var(--ink); resize: vertical; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn { font: 500 12px var(--sans); letter-spacing: .14em; text-transform: uppercase; padding: 13px 10px; border: 1px solid var(--maroon); background: var(--maroon); color: #fff; cursor: pointer; } .btn.alt { background: transparent; color: var(--maroon); }
.note { max-width: 760px; margin: 0 auto; text-align: center; font-size: 13px; color: var(--muted); padding: 0 20px; }

.ph { width: 340px; height: 700px; border-radius: 56px; border: 13px solid #17110c; position: relative; overflow: hidden; background: var(--img) center / cover; box-shadow: 0 40px 70px -20px #0009; flex: none; }

.ph::after { content: ""; position: absolute; top: 12px; left: 50%; translate: -50% 0; width: 96px; height: 26px; border-radius: 16px; background: #17110c; z-index: 3; }
.ph .nm { position: absolute; z-index: 2; left: 0; right: 0; bottom: 56px; text-align: center; color: #fff; font-family: var(--display); font-size: 54px; line-height: 1; text-shadow: 0 2px 14px #000a; } .ph .nm small { display: block; font: 500 14px var(--sans); letter-spacing: .3em; margin-top: 10px; color: var(--gold2); }
