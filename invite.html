<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wedding Invitation Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Jost:wght@200;300;400;500&family=Noto+Serif+Devanagari:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Great+Vibes&family=Noto+Serif+Malayalam:wght@400;600&family=Cinzel:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* One engine, four layouts. ?t= picks the theme: each theme has its own tokens AND its own section structure and CSS below. */
:root {
  --paper: #f7f1e6; --paper2: #efe5d2; --ink: #3b2c1c; --muted: #8a7757; --gold: #b88a3b;
  --btn: #7b1e3a; --btnfg: #fff; --outer: #e6dcc8; --field: rgba(255,255,255,.55);
  --serif: "Playfair Display", Georgia, serif; --sans: "Jost", system-ui, sans-serif;
  --pattern: repeating-linear-gradient(45deg, rgba(184,138,59,.07) 0 2px, transparent 2px 14px);
}
[data-theme="royal"] { --paper: #4a0d1a; --paper2: #5d1124; --ink: #f6e7c1; --muted: #dcbf80; --gold: #e3b24d; --btn: #e3b24d; --btnfg: #3a0914; --outer: #2c0610; --field: rgba(255,255,255,.08); --serif: "Cormorant Garamond", "Playfair Display", serif;
  --pattern: radial-gradient(circle at 50% 50%, transparent 0 9px, rgba(227,178,77,.22) 10px 11px, transparent 12px), radial-gradient(circle at 0 0, rgba(227,178,77,.16) 0 6px, transparent 7px); }
[data-theme="starry"] { --paper: #0b1030; --paper2: #131a4a; --ink: #eef0ff; --muted: #a7acd6; --gold: #e8d28a; --btn: #e8d28a; --btnfg: #12163a; --outer: #060818; --field: rgba(255,255,255,.07); --serif: "Cormorant Garamond", serif;
  --pattern: radial-gradient(1.5px 1.5px at 20% 30%, #fff, transparent), radial-gradient(1px 1px at 70% 20%, #fff, transparent), radial-gradient(1.5px 1.5px at 40% 75%, #fff, transparent), radial-gradient(1px 1px at 85% 60%, #fff, transparent), radial-gradient(1px 1px at 10% 85%, #fff, transparent); }
[data-theme="minimal"] { --paper: #fbfbf8; --paper2: #f1f1ec; --ink: #1d1d1b; --muted: #77776f; --gold: #1d1d1b; --btn: #1d1d1b; --btnfg: #fff; --outer: #e4e4de; --field: transparent; --serif: "Jost", system-ui, sans-serif; --pattern: none; }

[data-theme="seal"] { --paper: #f4efe6; --paper2: #e8dfcd; --ink: #33291f; --muted: #7f735f; --gold: #a98532; --btn: #33291f; --btnfg: #fff; --outer: #d9d0bf; --field: rgba(255,255,255,.6); --serif: "Cormorant Garamond", Georgia, serif; --pattern: none; }
[data-theme="temple"] { --paper: #fbf1dc; --paper2: #f3e0b8; --ink: #3b1d12; --muted: #8a6a45; --gold: #b5782a; --btn: #8a1c1c; --btnfg: #fff; --outer: #e8d3a6; --field: rgba(255,255,255,.6); --serif: "Playfair Display", Georgia, serif; --pattern: none; }
[data-theme="celestial"] { --paper: #070a12; --paper2: #101830; --ink: #eef0fb; --muted: #9aa3c4; --gold: #d8b765; --btn: #d8b765; --btnfg: #0a0e1c; --outer: #03040a; --field: rgba(255,255,255,.06); --serif: "Cormorant Garamond", serif;
  --pattern: radial-gradient(1.5px 1.5px at 20% 30%, #fff, transparent), radial-gradient(1px 1px at 70% 20%, #fff, transparent), radial-gradient(1.5px 1.5px at 40% 75%, #fff, transparent), radial-gradient(1px 1px at 85% 60%, #fff, transparent), radial-gradient(1px 1px at 10% 85%, #fff, transparent); }
[data-theme="kerala"] { --paper: #fbf7ea; --paper2: #f1e8cf; --ink: #1f3a2b; --muted: #6b7a5e; --gold: #bf9b3f; --btn: #1f5a3a; --btnfg: #fff; --outer: #dfd6b8; --field: rgba(255,255,255,.65); --serif: "Cormorant Garamond", Georgia, serif; --pattern: none; }
[data-theme="cathedral"] { --paper: #0b1530; --paper2: #14244a; --ink: #f6eed6; --muted: #bdb8a3; --gold: #e0b85c; --btn: #e0b85c; --btnfg: #1a1305; --outer: #060b1c; --field: rgba(255,255,255,.07); --serif: "Cormorant Garamond", Georgia, serif; --pattern: none; --cinzel: "Cinzel", Georgia, serif; }
[data-theme="grace"] { --paper: #fbfaf6; --paper2: #eaf1f9; --ink: #243047; --muted: #6c7a92; --gold: #b8943f; --btn: #2f4f86; --btnfg: #fff; --outer: #dfe8f2; --field: rgba(255,255,255,.75); --serif: "Cormorant Garamond", Georgia, serif; --pattern: none; --cinzel: "Cinzel", Georgia, serif; }
[data-theme="divine"] { --paper: #1c0c2e; --paper2: #2c1649; --ink: #fbf1d8; --muted: #cbbd9f; --gold: #f3d27a; --btn: #f3d27a; --btnfg: #2a1245; --outer: #0d0618; --field: rgba(255,255,255,.08); --serif: "Cormorant Garamond", Georgia, serif; --pattern: none; --cinzel: "Cinzel", Georgia, serif; }
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--outer); color: var(--ink); font-family: var(--sans); font-weight: 300; line-height: 1.6; }
.app { max-width: 480px; margin: 0 auto; background: var(--paper); min-height: 100vh; position: relative; overflow-x: hidden; }
h1, h2, h3 { font-family: var(--serif); font-weight: 400; margin: 0; text-wrap: balance; }
p { margin: 0 0 10px; } ul { padding: 0; margin: 0; list-style: none; } img { display: block; max-width: 100%; }
.eyebrow { font-size: 11px; letter-spacing: .32em; text-transform: uppercase; color: var(--gold); font-weight: 500; }
.hi { font-family: "Noto Serif Devanagari", serif; letter-spacing: 0; }
section { padding: 56px 24px; text-align: center; }
h2 { font-size: 32px; margin: 8px 0 28px; }
.lead { font-family: var(--serif); font-style: italic; color: var(--muted); }
.note { font-size: 13px; color: var(--muted); }
.back { position: fixed; top: 12px; left: 12px; z-index: 60; background: var(--btn); color: var(--btnfg); font-size: 12px; letter-spacing: .1em; padding: 8px 14px; text-decoration: none; border-radius: 20px; }
html.embed, html.embed body { overflow: hidden; }
html.embed .back, html.embed .order, html.embed #mute { display: none !important; }
.order { position: fixed; z-index: 60; bottom: 16px; left: 12px; background: #1faa59; color: #fff; padding: 12px 18px; border-radius: 28px; font-weight: 500; font-size: 14px; text-decoration: none; box-shadow: 0 4px 16px #0004; }
a.btn, button.btn, .btn { font: inherit; font-weight: 500; letter-spacing: .12em; font-size: 13px; text-transform: uppercase; border: 1px solid var(--btn); padding: 14px 18px; cursor: pointer; background: var(--btn); color: var(--btnfg); text-decoration: none; display: block; text-align: center; }
.btn.alt { background: transparent; color: var(--btn); }
[data-theme="royal"] .btn.alt, [data-theme="starry"] .btn.alt, [data-theme="celestial"] .btn.alt, [data-theme="cathedral"] .btn.alt, [data-theme="divine"] .btn.alt { color: var(--gold); border-color: var(--gold); }
.btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
form { display: grid; gap: 16px; text-align: left; }
label { display: grid; gap: 6px; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
input, select, textarea { font: inherit; font-size: 16px; font-weight: 300; letter-spacing: 0; text-transform: none; color: var(--ink); background: var(--field); border: 1px solid color-mix(in srgb, var(--gold) 65%, transparent); border-radius: 0; padding: 12px; width: 100%; min-width: 0; }
option { color: #222; } .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.wish { text-align: left; border-bottom: 1px solid color-mix(in srgb, var(--gold) 28%, transparent); padding: 12px 0; } .wish b { font-family: var(--serif); font-weight: 600; }
#wishes { margin-top: 20px; }
.count { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 24px; }
.count b { display: block; font-family: var(--serif); font-weight: 400; font-size: 30px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.count span { font-size: 10px; letter-spacing: .2em; color: var(--muted); }
.big-date { font-family: var(--serif); font-size: 24px; }
.phimg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

/* intro */
#intro { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: var(--outer); cursor: pointer; transition: opacity .6s .9s, visibility 0s 1.5s; }
#intro .stage { position: relative; width: min(100%, 480px); height: 100%; overflow: hidden; background: var(--paper2); }
.door { position: absolute; top: 0; bottom: 0; width: 50%; background: var(--pattern), var(--paper2); background-size: 28px 28px, 28px 28px; transition: transform 1.2s cubic-bezier(.7,0,.2,1); }
[data-theme="royal"] .door::after { content: ""; position: absolute; inset: 9% 12% 9% 12%; border: 2px solid var(--gold); border-radius: 160px 160px 6px 6px; box-shadow: inset 0 0 0 6px var(--paper2), inset 0 0 0 7px var(--gold); background: radial-gradient(circle, var(--gold) 0 3px, transparent 4px) 0 0 / 24px 24px; opacity: .55; } [data-theme="royal"] .door.r::after { border-radius: 160px 160px 6px 6px; }
[data-theme="floral"] .door { background: radial-gradient(circle at 70% 24%, #f2c4be 0 22px, transparent 23px), radial-gradient(circle at 30% 70%, #f7d6d1 0 30px, transparent 31px), radial-gradient(circle at 80% 85%, #efb8b1 0 18px, transparent 19px), repeating-linear-gradient(45deg, rgba(184,138,59,.08) 0 2px, transparent 2px 14px), var(--paper2); }
.door.l { left: 0; border-right: 2px solid var(--gold); } .door.r { right: 0; border-left: 2px solid var(--gold); }
.seal { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; transition: opacity .4s; }
.seal .mono { font-family: var(--serif); font-size: 64px; line-height: 1; } .seal .mono i { color: var(--gold); font-size: .5em; padding-inline: 6px; }
.seal .tap { margin-top: 18px; font-size: 11px; letter-spacing: .3em; color: var(--muted); animation: pulse 2s infinite; }
.seal .rule { width: 60px; height: 1px; background: var(--gold); margin: 14px auto 0; } .seal .gan { color: var(--gold); font-size: 15px; margin-bottom: 18px; }
@keyframes pulse { 50% { opacity: .35; } }
#intro.open .door.l { transform: translateX(-100%); } #intro.open .door.r { transform: translateX(100%); }
#intro.open .seal { opacity: 0; } #intro.open { opacity: 0; visibility: hidden; pointer-events: none; }
[data-theme="starry"] .door { display: none; } [data-theme="starry"] #intro .stage { background: radial-gradient(circle at 50% 40%, #2a3480, #0b1030 70%), #0b1030; transition: transform 1.6s ease-in, opacity 1.2s ease-in .3s; } [data-theme="starry"] #intro .stage::before { content: ""; position: absolute; inset: 0; background: var(--pattern); background-size: 160px 160px; animation: tw 3s ease-in-out infinite alternate; } [data-theme="starry"] #intro.open .stage { transform: scale(2.6); opacity: 0; } [data-theme="starry"] #intro.open { transition-delay: 1.1s; } @keyframes tw { from { opacity: .3; } to { opacity: 1; } }
[data-theme="starry"] .seal .mono { font-style: italic; text-shadow: 0 0 24px #7f8cffaa; }
[data-theme="minimal"] .door.l { width: 100%; border: 0; background: var(--paper); } [data-theme="minimal"] .door.r { display: none; }
[data-theme="minimal"] #intro.open .door.l { transform: translateY(-100%); }
[data-theme="minimal"] .seal .mono { font-weight: 200; letter-spacing: .1em; font-size: 54px; }

/* ============ FLORAL : classic centred, arch portrait, timeline ============ */
[data-theme="floral"] section + section { border-top: 1px solid rgba(184,138,59,.25); }
.f-hero { padding: 72px 24px 56px; text-align: center; background: linear-gradient(var(--paper2), var(--paper)); position: relative; }
.f-hero h1 { font-size: clamp(46px, 13vw, 64px); line-height: 1.05; margin: 18px 0; } .f-hero h1 span { display: block; font-style: italic; color: var(--gold); font-size: .45em; margin: 6px 0; }
.f-hero .photo { aspect-ratio: 4/5; width: 78%; margin: 28px auto 0; border-radius: 200px 200px 6px 6px; border: 1px solid var(--gold); padding: 8px; }
.f-hero .photo div { width: 100%; height: 100%; border-radius: 192px 192px 2px 2px; overflow: hidden; position: relative; }
.f-sprig { width: 140px; margin: 0 auto 10px; display: block; }
.people { display: grid; gap: 28px; } .person .badge { width: 64px; height: 64px; margin: 0 auto 10px; border: 1px solid var(--gold); border-radius: 50%; display: grid; place-items: center; font-family: var(--serif); font-size: 26px; color: var(--gold); }
.person h3 { font-size: 26px; } .person small { color: var(--muted); display: block; max-width: 260px; margin: 6px auto 0; }
.quote { margin-top: 36px; font-family: var(--serif); font-style: italic; color: var(--muted); }
.timeline { position: relative; text-align: left; padding-left: 28px; } .timeline::before { content: ""; position: absolute; left: 5px; top: 6px; bottom: 6px; width: 1px; background: var(--gold); }
.timeline li { position: relative; padding-bottom: 28px; } .timeline li::before { content: ""; position: absolute; left: -28px; top: 7px; width: 11px; height: 11px; background: var(--paper); border: 1px solid var(--gold); border-radius: 50%; }
.timeline b { font-family: var(--serif); font-weight: 600; font-size: 19px; display: block; } .timeline em { font-style: normal; color: var(--gold); font-size: 12px; letter-spacing: .2em; } .timeline p { color: var(--muted); font-size: 15px; margin-top: 4px; }
[data-theme="floral"] .count div { border: 1px solid rgba(184,138,59,.5); padding: 14px 0 10px; }
.event { border: 1px solid color-mix(in srgb, var(--gold) 55%, transparent); padding: 28px 20px; margin-bottom: 20px; background: color-mix(in srgb, var(--paper2) 55%, transparent); }
.event h3 { font-size: 28px; margin: 8px 0 4px; } .event .day { color: var(--muted); font-size: 13px; letter-spacing: .1em; } .event .time { color: var(--gold); letter-spacing: .12em; font-size: 14px; }
.event .where { margin-top: 12px; } .event .where small { color: var(--muted); display: block; }
.masonry { column-count: 2; column-gap: 8px; } .masonry > div { break-inside: avoid; margin-bottom: 8px; position: relative; overflow: hidden; aspect-ratio: var(--ar); }
[data-theme="floral"] .footer { padding: 56px 24px 110px; text-align: center; background: var(--paper2); }

/* ============ ROYAL : Indian, jharokha arch, pillars, scroll-snap gallery ============ */
.r-garland { height: 26px; background: radial-gradient(circle at 13px 13px, #f39c12 0 9px, transparent 10px), radial-gradient(circle at 39px 13px, #ffcf5a 0 9px, transparent 10px); background-size: 52px 26px; }
.r-hero { padding: 36px 24px 48px; text-align: center; background: var(--pattern), linear-gradient(#5d1124, var(--paper)); background-size: 34px 34px, auto; }
.r-hero .gan { color: var(--gold); font-size: 17px; margin-bottom: 8px; }
.jharokha { width: 78%; margin: 22px auto 26px; padding: 10px; border: 2px solid var(--gold); border-radius: 220px 220px 0 0; position: relative; background: var(--paper); box-shadow: 0 0 0 6px var(--paper), 0 0 0 7px var(--gold); }
.jharokha div { aspect-ratio: 4/5; border-radius: 210px 210px 0 0; overflow: hidden; position: relative; border: 1px solid var(--gold); }
.r-hero h1 { font-size: clamp(52px, 15vw, 76px); line-height: 1; color: var(--gold); font-weight: 500; } .r-hero h1 small { -webkit-text-fill-color: var(--ink); }
.r-hero h1 small { display: block; font-size: 18px; color: var(--ink); letter-spacing: .3em; margin: 8px 0; font-weight: 400; }
.r-date { margin: 22px auto 0; display: inline-grid; grid-template-columns: auto auto auto; align-items: center; gap: 18px; border-block: 1px solid var(--gold); padding: 10px 22px; }
.r-date b { font-family: var(--serif); font-size: 52px; font-weight: 500; color: var(--gold); line-height: 1; } .r-date span { font-size: 12px; letter-spacing: .25em; text-align: left; }
.r-title { display: grid; justify-items: center; gap: 6px; } .r-title .hi { color: var(--gold); font-size: 20px; } .r-title h2 { margin: 0 0 24px; font-size: 38px; }
.r-fam { display: grid; gap: 22px; }
.r-card { border: 1px solid var(--gold); border-radius: 120px 120px 6px 6px; padding: 40px 22px 26px; position: relative; background: linear-gradient(var(--paper2), transparent); }
.r-card .hi { color: var(--gold); font-size: 15px; } .r-card h3 { font-size: 30px; margin: 6px 0; color: var(--ink); } .r-card small { color: var(--muted); display: block; max-width: 240px; margin-inline: auto; }
.r-med { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 22px; }
.r-med div { aspect-ratio: 1; border-radius: 50%; border: 1px solid var(--gold); display: grid; place-content: center; position: relative; box-shadow: inset 0 0 0 4px var(--paper), inset 0 0 0 5px color-mix(in srgb, var(--gold) 50%, transparent); }
.r-med b { font-family: var(--serif); font-size: 26px; font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; } .r-med span { font-size: 8px; letter-spacing: .15em; color: var(--muted); }
.r-ev { border: 1px solid var(--gold); margin-bottom: 18px; text-align: center; background: var(--paper); }
.r-ev .hd { background: var(--gold); color: #3a0914; padding: 12px; } .r-ev .hd .hi { font-size: 22px; font-weight: 600; display: block; line-height: 1.3; } .r-ev .hd small { letter-spacing: .3em; font-size: 10px; text-transform: uppercase; }
.r-ev .bd { padding: 22px 18px 24px; } .r-ev .day { font-family: var(--serif); font-size: 20px; } .r-ev .time { color: var(--gold); letter-spacing: .14em; font-size: 14px; margin: 2px 0 12px; } .r-ev .bd small { color: var(--muted); display: block; margin-bottom: 14px; }
.r-gal > div { border: 1px solid var(--gold); border-radius: 80px 80px 0 0; }
.r-gal > div:nth-child(even) { border-radius: 0 0 80px 80px; }
.r-foot { padding: 56px 24px 110px; text-align: center; background: var(--pattern), #3a0914; background-size: 34px 34px, auto; } .r-foot .hi { color: var(--gold); font-size: 20px; display: block; margin-bottom: 10px; }

/* ============ STARRY : photo-led cinematic, glow, glass cards, constellation ============ */
.s-hero { position: relative; aspect-ratio: 4/5.4; overflow: hidden; }
.s-hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(transparent 35%, var(--paper) 96%), linear-gradient(#0b103099, transparent 30%); }
.s-hero .twinkle { position: absolute; inset: 0; z-index: 2; background: var(--pattern); background-size: 240px 240px; animation: tw 4s ease-in-out infinite alternate; }
@keyframes tw { from { opacity: .35; } to { opacity: 1; } }
.s-hero .txt { position: absolute; z-index: 3; left: 0; right: 0; bottom: 18px; text-align: center; padding-inline: 20px; }
.s-hero h1 { font-size: clamp(52px, 15vw, 76px); font-style: italic; font-weight: 400; line-height: .95; text-shadow: 0 0 40px #7f8cffaa; } .s-hero h1 span { display: block; font-size: .4em; color: var(--gold); letter-spacing: .2em; }
.pill { display: inline-block; margin-top: 16px; border: 1px solid color-mix(in srgb, var(--gold) 70%, transparent); padding: 8px 18px; border-radius: 40px; font-size: 12px; letter-spacing: .24em; text-transform: uppercase; background: #0b103080; backdrop-filter: blur(6px); }
[data-theme="starry"] section { background: transparent; position: relative; }
.s-quote { font-family: var(--serif); font-style: italic; font-size: 24px; line-height: 1.4; max-width: 340px; margin: 0 auto; }
.constel { position: relative; text-align: left; }
.constel::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: linear-gradient(transparent, var(--gold), transparent); }
.constel li { position: relative; width: 50%; padding: 0 22px 34px 0; text-align: right; }
.constel li:nth-child(even) { margin-left: 50%; padding: 0 0 34px 22px; text-align: left; }
.constel li::after { content: "\2726"; position: absolute; right: -9px; top: -2px; color: var(--gold); font-size: 16px; text-shadow: 0 0 12px var(--gold); background: var(--paper); line-height: 1; }
.constel li:nth-child(even)::after { right: auto; left: -9px; }
.constel em { font-style: normal; color: var(--gold); font-size: 12px; letter-spacing: .2em; } .constel b { font-family: var(--serif); font-size: 21px; font-weight: 500; display: block; } .constel p { font-size: 13px; color: var(--muted); }
.s-ring { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 24px; }
.s-ring div { aspect-ratio: 1; border-radius: 50%; display: grid; place-content: center; background: radial-gradient(circle, #7f8cff22, transparent 70%); border: 1px solid color-mix(in srgb, var(--gold) 55%, transparent); box-shadow: 0 0 22px #7f8cff44; }
.s-ring b { font-family: var(--serif); font-size: 28px; font-weight: 400; font-variant-numeric: tabular-nums; line-height: 1; } .s-ring span { font-size: 8px; letter-spacing: .18em; color: var(--muted); }
.glass { border: 1px solid #ffffff2a; background: linear-gradient(135deg, #ffffff14, #ffffff05); backdrop-filter: blur(8px); border-radius: 18px; padding: 26px 20px; margin-bottom: 16px; box-shadow: 0 8px 30px #0006; }
.glass h3 { font-size: 30px; font-style: italic; margin: 4px 0; } .glass .time { font-family: var(--serif); font-size: 34px; color: var(--gold); } .glass small { color: var(--muted); display: block; margin-bottom: 14px; }
.polaroids { column-gap: 14px; padding-inline: 4px; }
